name: Publish Tacklebox 0.1.1
on:
  push:
    branches: [install-v0.1.1]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          unzip -p module.zip module.json > assets/module.json
          test "$(jq -r .version assets/module.json)" = "0.1.1"
          cp module.zip assets/
          gh release create v0.1.1 assets/module.json assets/module.zip --target 0a7b36d3865b2cb0f8d771c3a9879a7a13363be8 --title 'PF2e Tacklebox 0.1.1' --notes 'Custom icons for PF2e character action rows.'
